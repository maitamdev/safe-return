name: SafeReturn CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Ensure committed Anchor IDL is present
        run: |
          test -f target/idl/findback.json
          node -e "const idl=require('./target/idl/findback.json'); if(!idl.address||!idl.instructions?.length) process.exit(1)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: "true"

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p findback
      - name: IDL address matches Anchor.toml program id
        run: |
          node -e "
            const fs=require('fs');
            const idl=JSON.parse(fs.readFileSync('target/idl/findback.json','utf8'));
            const toml=fs.readFileSync('Anchor.toml','utf8');
            const m=toml.match(/findback\s*=\s*\"([^\"]+)\"/);
            if(!m) process.exit(1);
            if(idl.address!==m[1]) {
              console.error('IDL address', idl.address, '!= Anchor.toml', m[1]);
              process.exit(1);
            }
            console.log('IDL program id OK', idl.address);
          "
