[workspace]
members = ["programs/findback"]
resolver = "2"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
debug-assertions = false
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
