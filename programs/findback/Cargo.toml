[package]
name = "findback"
version = "0.1.0"
description = "SafeReturn — lost & found bounty escrow on Solana"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "findback"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["no-log-ix-name"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# Token-only surface — avoid pulling Token-2022 / confidential transfer into the SBF binary.
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "associated_token"] }
